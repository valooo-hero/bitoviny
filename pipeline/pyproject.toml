[project]
name = "bitoviny-pipeline"
version = "0.1.0"
description = "Redakčná pipeline portálu Bitoviny"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "trafilatura>=2.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "fastembed>=0.4",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-groq>=0.2",
  "langchain-openai>=0.2",
  "langfuse>=3.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bitoviny*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
