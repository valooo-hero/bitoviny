# Dočasné meranie ceny: všetky LLM kroky výhradne cez GPT-6 Luna.
roly:
  vyber_tem:
    teplota: 0.2
    modely:
    - provider: openai
      model: gpt-6-luna
      metoda: json_schema
      reasoning: low
      verbosity: low
      max_output_tokens: 2048
  autorka:
    teplota: 0.6
    modely:
    - provider: openai
      model: gpt-6-luna
      metoda: json_schema
      reasoning: medium
      verbosity: medium
      max_output_tokens: 8192
  factcheck:
    teplota: 0.0
    modely:
    - provider: openai
      model: gpt-6-luna
      metoda: json_schema
      reasoning: medium
      verbosity: low
      max_output_tokens: 16384
  korektura:
    teplota: 0.0
    modely:
    - provider: openai
      model: gpt-6-luna
      metoda: json_schema
      reasoning: medium
      verbosity: low
      max_output_tokens: 8192
  fotoeditor:
    teplota: 0.3
    modely:
    - provider: openai
      model: gpt-6-luna
      metoda: json_schema
      reasoning: low
      verbosity: low
      max_output_tokens: 2048
