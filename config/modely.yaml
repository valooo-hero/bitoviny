# Modely sa skúšajú v uvedenom poradí. Tarify a kľúče opisuje docs/LLM-PROVIDERY.md.
roly:
  vyber_tem:
    teplota: 0.2
    modely:
      - &groq { provider: groq, model: openai/gpt-oss-120b }
      - &lite { provider: google, model: gemini-3.5-flash-lite }
      - &ernie { provider: openrouter, model: "baidu/ernie-5.5-flash-preview:free", metoda: json_schema }
      - { provider: deepinfra, model: deepseek-ai/DeepSeek-V4-Flash-0731 }

  # Jazykový verdikt nad titulkom, perexom a zdrojmi. Vstup sa delí na dávky.
  kontrola_duplicit:
    teplota: 0.0
    modely:
      - { provider: google, model: gemini-3.5-flash-lite }
      - { provider: groq, model: openai/gpt-oss-120b }
      - { provider: openrouter, model: "baidu/ernie-5.5-flash-preview:free", metoda: json_schema }
      - { provider: deepinfra, model: deepseek-ai/DeepSeek-V4-Flash-0731 }

  autorka:
    teplota: 0.6
    modely:
      - &flash { provider: google, model: gemini-3.8-flash }
      - *lite
      - *ernie
      - *groq
      - { provider: openai, model: gpt-6-luna, metoda: json_schema, reasoning: medium, verbosity: medium, max_output_tokens: 8192 }

  factcheck:
    teplota: 0.0
    modely:
      - *lite
      - *ernie
      - *flash
      - *groq
      - { provider: deepinfra, model: deepseek-ai/DeepSeek-V4-Flash-0731 }

  korektura:
    teplota: 0.0
    modely:
      - *lite
      - *flash
      - *ernie
      - *groq
      - { provider: deepinfra, model: deepseek-ai/DeepSeek-V4-Flash-0731 }

  fotoeditor:
    teplota: 0.3
    modely:
      - *groq
      - *lite
      - *ernie
      - { provider: deepinfra, model: deepseek-ai/DeepSeek-V4-Flash-0731 }
