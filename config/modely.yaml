# Priradenie jazykových modelov k rolám. Prvý v zozname je hlavný, ďalšie sú zálohy
# (LangChain with_fallbacks). Všetko sú bezplatné tarify, pozri docs/LLM-PROVIDERY.md.
# provider: google | groq | openrouter
# metoda: nepovinný spôsob štruktúrovaného výstupu (napr. json_schema)

roly:
  # Krátka úloha nad titulkami, zmestí sa do limitu Groq 8 000 tokenov za minútu.
  vyber_tem:
    teplota: 0.2
    modely:
      - { provider: groq, model: openai/gpt-oss-120b }
      # Qwen na Groq kazí volanie nástrojov, preto výstup cez JSON schému.
      - { provider: groq, model: qwen/qwen3.8-27b, metoda: json_schema }
      - { provider: google, model: gemini-3.5-flash-lite }

  # Najlepšia dostupná slovenčina. Vstup sú celé zdrojové texty, preto nie Groq.
  autorka:
    teplota: 0.6
    modely:
      # Najnovší Flash býva preťažený (503), preto dve ďalšie generácie v zálohe.
      # Každý model Gemini má vlastný denný limit.
      - { provider: google, model: gemini-3.8-flash }
      - { provider: google, model: gemini-3.5-flash }
      - { provider: google, model: gemini-3.5-flash-lite }
      - { provider: openrouter, model: "baidu/ernie-5.5-flash-preview:free" }

  # Iný model než autorka, aby nekontrolovala vlastnú prácu ten istý model.
  # Vstup sú celé zdroje aj koncept, preto nie Groq.
  factcheck:
    teplota: 0.0
    modely:
      - { provider: google, model: gemini-3.5-flash }
      - { provider: google, model: gemini-3.5-flash-lite }
      - { provider: google, model: gemini-3.8-flash }
      - { provider: openrouter, model: "baidu/ernie-5.5-flash-preview:free" }

  # Krátky vstup aj výstup (len zoznam úprav). V porovnaní na texte so známymi
  # chybami našiel Gemini Flash-Lite aspoň zjavnú chybu, Qwen nevrátil nič.
  korektura:
    teplota: 0.0
    modely:
      - { provider: google, model: gemini-3.5-flash-lite }
      - { provider: google, model: gemini-3.5-flash }
      - { provider: groq, model: openai/gpt-oss-120b, metoda: json_schema }
      - { provider: groq, model: qwen/qwen3.8-27b, metoda: json_schema }

  # Len vymýšľa hľadané výrazy pre fotobanky. Práva posudzujú pravidlá v kóde.
  fotoeditor:
    teplota: 0.3
    modely:
      - { provider: groq, model: openai/gpt-oss-20b }
      - { provider: groq, model: qwen/qwen3.8-27b, metoda: json_schema }
