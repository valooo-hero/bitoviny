# Konfigurácia Cloudflare Pages. Tajomstvá sem nepatria, nastavujú sa
# v dashboarde: Settings > Variables and Secrets.
#   GITHUB_CLIENT_SECRET   tajomstvo OAuth aplikácie GitHubu
name = "bitoviny"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# Workers AI pre generovanie ilustrácií (FLUX.1-schnell), bezplatný denný limit.
[ai]
binding = "AI"

[vars]
GITHUB_REPO = "valooo-hero/bitoviny"
# Jediný účet GitHubu, ktorý smie do redakčného rozhrania.
ADMIN_GITHUB_LOGIN = "valooo-hero"
# Prihlásenie funguje len na tejto adrese, nie na náhľadových nasadeniach.
ADMIN_ORIGIN = "https://bitoviny.pages.dev"
# Client ID OAuth aplikácie GitHubu „Bitoviny redakcia“ (nie je tajné).
GITHUB_CLIENT_ID = "Ov23lim5NhJm2eii9ApW"
